server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # HTML shell — always revalidate so every load picks up the latest build
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Version probe — never cache so open tabs detect a new deploy immediately
    location = /version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Content-hashed assets (webpack [contenthash]) — safe to cache forever
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|avif)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}